    <script>
      (function() {
        var btn = document.getElementById('pwa-force-update-btn');
        function clearAndReload() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
